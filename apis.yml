aid: lightyear
name: Lightyear
description: Lightyear is a European retail investing platform founded by former Wise (TransferWise) employees
  Martin Sokk and Mihkel Aamer, offering commission-light access to roughly 6,000 stocks, ETFs, money
  market funds, bonds and crypto, plus interest-bearing cash "Vaults" managed with BlackRock and J.P.
  Morgan money market funds. The service runs through mobile apps (iOS and Android) and a web app, with
  a separate Lightyear for Business offering. Lightyear UK Ltd is authorised by the UK Financial Conduct
  Authority (FRN 987226) and Lightyear Europe AS is regulated by the Estonian Financial Supervision Authority,
  with operations in London and Tallinn. Lightyear does not publish a public developer API or developer
  portal; its api.lightyear.com host serves the first-party apps and publishes an RFC 8414 OAuth 2.0 authorization
  server metadata document for an internal MCP scope.
